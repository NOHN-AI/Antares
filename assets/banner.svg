<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#113a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- star mark -->
  <g transform="translate(120,150)" fill="none" stroke="url(#accent)" stroke-width="3">
    <polygon points="0,-70 16,-22 66,-22 25,8 41,56 0,26 -41,56 -25,8 -66,-22 -16,-22"/>
  </g>

  <text x="240" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" fill="#f8fafc">Antares</text>
  <text x="244" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="28" font-weight="400" fill="#9cc8e8">
    Audit and Federation for AI agents
  </text>
  <rect x="244" y="220" width="220" height="4" rx="2" fill="url(#accent)"/>

  <text x="244" y="262" font-family="Consolas, Menlo, monospace"
        font-size="18" fill="#7aa3c4">
    runs over HTTP/3 · A2A · MCP · TCP+TLS · WebSockets
  </text>
</svg>
