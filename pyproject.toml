[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antares"
version = "2.1.0"
description = "Audit and federation message layer for AI agents: signed causal evidence, cone completeness, rebuttable claims, selective disclosure (transport-independent)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "nohn3043-arch", email = "nohn3043@gmail.com" }
]
keywords = [
    "ai-agents",
    "audit",
    "federation",
    "causal-evidence",
    "merkle",
    "selective-disclosure",
    "ed25519",
    "cbor",
    "a2a",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "cbor2>=5.4",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "build>=1.0",
]

[project.scripts]
antares-verify = "antares.cli:main"

[project.urls]
Homepage = "https://github.com/nohn3043-arch/Antares"
Repository = "https://github.com/nohn3043-arch/Antares"
Issues = "https://github.com/nohn3043-arch/Antares/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
antares = ["py.typed"]
